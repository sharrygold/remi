name: Perch
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    # The user-facing name lives here. Change it and regenerate to rename the app.
    APP_DISPLAY_NAME: Perch
targets:
  Perch:
    type: application
    platform: macOS
    sources: [App]
    scheme:
      testTargets: [PerchTests]
    settings:
      base:
        PRODUCT_NAME: $(APP_DISPLAY_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: com.example.oldapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(APP_DISPLAY_NAME)
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        # Signed with a free Apple ID (Personal Team), so macOS keeps permissions such as
        # notifications and Open at login across rebuilds. Use "-" to build without an account.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YOURTEAMID
        CODE_SIGN_IDENTITY: Apple Development
        ENABLE_HARDENED_RUNTIME: NO
  PerchTests:
    type: bundle.unit-test
    platform: macOS
    # Compiles the UI-free core directly, so tests run without launching the floating app.
    sources: [App/Core, Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
