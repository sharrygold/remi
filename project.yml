name: Remi
options:
  bundleIdPrefix: io.github.sharrygold
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    # The user-facing name lives here. Change it and regenerate to rename the app.
    APP_DISPLAY_NAME: Remi
targets:
  Remi:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: [AppIcon.icon]
      - path: App/AppIcon.icon
        type: file
        buildPhase: resources
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    scheme:
      testTargets: [RemiTests]
    settings:
      base:
        PRODUCT_NAME: $(APP_DISPLAY_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sharrygold.remi
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: $(APP_DISPLAY_NAME)
        INFOPLIST_KEY_NSAppleEventsUsageDescription: $(APP_DISPLAY_NAME) reads the address and title of the current tab when you ask it to save the tab.
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        # Values come from Config/Signing.xcconfig: ad hoc unless a local override names a team.
        CODE_SIGN_STYLE: $(APP_SIGN_STYLE)
        DEVELOPMENT_TEAM: $(APP_TEAM)
        CODE_SIGN_IDENTITY: $(APP_SIGN_IDENTITY)
        ENABLE_HARDENED_RUNTIME: NO
  RemiTests:
    type: bundle.unit-test
    platform: macOS
    # Compiles the UI-free core directly, so tests run without launching the floating app.
    sources: [App/Core, Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
