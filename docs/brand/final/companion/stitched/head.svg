<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -14 48 28">
<!-- Head (stitched). Local coords: origin is the neck pivot, placed at (81,35) in the 120 space. Beak points along +x. Rotate this whole group; it is symmetric about the beak line so it never needs flipping. Crest: a little fan of three rounded feathers in body colour with stitched edges and a gold quill (class quill, crest token), drawn behind the skull. Crest pivot for lag: (-9,0). -->
<g id="crest">
<g transform="rotate(-30)"><path d="M-8.5 -1.32 C-11.12 -2.80 -13.80 -2.40 -15.40 -1.06 Q-16.30 0 -15.40 1.06 C-13.80 2.40 -11.12 2.80 -8.5 1.32 Z" fill="#F2ECE0" stroke="#C9A25A" stroke-width="0.7" stroke-dasharray="1.4 1.1"/><path class="quill" d="M-9.0 0 L-14.40 0" fill="none" stroke="#C9A25A" stroke-width="0.8" stroke-linecap="round"/></g>
<g transform="rotate(30)"><path d="M-8.5 -1.32 C-11.12 -2.80 -13.80 -2.40 -15.40 -1.06 Q-16.30 0 -15.40 1.06 C-13.80 2.40 -11.12 2.80 -8.5 1.32 Z" fill="#F2ECE0" stroke="#C9A25A" stroke-width="0.7" stroke-dasharray="1.4 1.1"/><path class="quill" d="M-9.0 0 L-14.40 0" fill="none" stroke="#C9A25A" stroke-width="0.8" stroke-linecap="round"/></g>
<g transform="rotate(0)"><path d="M-8.5 -1.43 C-11.82 -3.00 -15.80 -2.60 -17.40 -1.14 Q-18.30 0 -17.40 1.14 C-15.80 2.60 -11.82 3.00 -8.5 1.43 Z" fill="#F2ECE0" stroke="#C9A25A" stroke-width="0.7" stroke-dasharray="1.4 1.1"/><path class="quill" d="M-9.0 0 L-16.40 0" fill="none" stroke="#C9A25A" stroke-width="0.8" stroke-linecap="round"/></g>
</g>
<circle id="skull" r="11" fill="#F2ECE0" stroke="#C9A25A" stroke-width="0.8" stroke-dasharray="1.8 1.3"/>
<path id="beak" d="M9.5 -4.2 L22.5 0 L9.5 4.2 Z" fill="#C9A25A"/>
<path id="mouth" d="M10.5 0 L18.5 0" stroke="#121110" stroke-width="0.5" stroke-linecap="round" opacity="0.5"/>
<g id="eye"><circle cx="3" cy="0" r="2.4" fill="#121110"/><circle cx="3.8" cy="-0.8" r="0.7" fill="#F2ECE0"/></g>
</svg>
