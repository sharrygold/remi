<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -12 48 24">
<!-- Head (stitched). Local coords: origin is the neck pivot, placed at (81,35) in the 120 space. Beak points along +x. Rotate this whole group; it is symmetric about the beak line so it never needs flipping. Crest pivot for lag: (-9,0). -->
<g id="crest" fill="#C9A25A">
<path d="M-9 -3 C-15 -6.5 -19.5 -9.5 -23 -8.5 C-19.5 -5.5 -15 -2.5 -10 -0.8 Z"/>
<path d="M-9 3 C-15 6.5 -19.5 9.5 -23 8.5 C-19.5 5.5 -15 2.5 -10 0.8 Z"/>
</g>
<circle id="skull" r="11" fill="#F2ECE0" stroke="#C9A25A" stroke-width="0.8" stroke-dasharray="1.8 1.3"/>
<path id="beak" d="M9.5 -4.2 L22.5 0 L9.5 4.2 Z" fill="#C9A25A"/>
<path id="mouth" d="M10.5 0 L18.5 0" stroke="#121110" stroke-width="0.5" stroke-linecap="round" opacity="0.5"/>
<g id="eye"><circle cx="3" cy="0" r="2.4" fill="#121110"/><circle cx="3.8" cy="-0.8" r="0.7" fill="#F2ECE0"/></g>
</svg>
