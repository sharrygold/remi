<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
<!-- Dozing head and neck (stitched), absolute 120 space. Replaces neck + head + head-shade while dozing. Crest is the same three-feather fan as head.svg, placed with translate(79 42) rotate(160) to match the dozing beak. -->
<defs>
<pattern id="satin" width="2.4" height="2.4" patternUnits="userSpaceOnUse" patternTransform="rotate(32)"><rect width="1.1" height="2.4" fill="#C9A25A"/></pattern>
<radialGradient id="shadeBody" cx="42%" cy="22%" r="85%"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/><stop offset="0.55" stop-color="#F2ECE0" stop-opacity="0"/><stop offset="1" stop-color="#7A6A50" stop-opacity="0.32"/></radialGradient>
<radialGradient id="shadeHead" cx="38%" cy="28%" r="78%"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/><stop offset="0.5" stop-color="#F2ECE0" stop-opacity="0"/><stop offset="1" stop-color="#7A6A50" stop-opacity="0.4"/></radialGradient>
</defs>
<path id="neck-doze" d="M88 70 Q93 55 80 43" fill="none" stroke="#F2ECE0" stroke-width="12" stroke-linecap="round"/>
<g id="crest" transform="translate(79 42) rotate(160)">
<g transform="rotate(-30)"><path d="M-8.5 -1.32 C-11.12 -2.80 -13.80 -2.40 -15.40 -1.06 Q-16.30 0 -15.40 1.06 C-13.80 2.40 -11.12 2.80 -8.5 1.32 Z" fill="#F2ECE0" stroke="#C9A25A" stroke-width="0.7" stroke-dasharray="1.4 1.1"/><path class="quill" d="M-9.0 0 L-14.40 0" fill="none" stroke="#C9A25A" stroke-width="0.8" stroke-linecap="round"/></g>
<g transform="rotate(30)"><path d="M-8.5 -1.32 C-11.12 -2.80 -13.80 -2.40 -15.40 -1.06 Q-16.30 0 -15.40 1.06 C-13.80 2.40 -11.12 2.80 -8.5 1.32 Z" fill="#F2ECE0" stroke="#C9A25A" stroke-width="0.7" stroke-dasharray="1.4 1.1"/><path class="quill" d="M-9.0 0 L-14.40 0" fill="none" stroke="#C9A25A" stroke-width="0.8" stroke-linecap="round"/></g>
<g transform="rotate(0)"><path d="M-8.5 -1.43 C-11.82 -3.00 -15.80 -2.60 -17.40 -1.14 Q-18.30 0 -17.40 1.14 C-15.80 2.60 -11.82 3.00 -8.5 1.43 Z" fill="#F2ECE0" stroke="#C9A25A" stroke-width="0.7" stroke-dasharray="1.4 1.1"/><path class="quill" d="M-9.0 0 L-16.40 0" fill="none" stroke="#C9A25A" stroke-width="0.8" stroke-linecap="round"/></g>
</g>
<circle id="skull-doze" cx="79" cy="42" r="11" fill="#F2ECE0" stroke="#C9A25A" stroke-width="0.8" stroke-dasharray="1.8 1.3"/>
<circle cx="79" cy="42" r="11" fill="url(#shadeHead)"/>
<path id="beak-doze" d="M70 43 L60 49 L71 50 Z" fill="#C9A25A"/>
<path id="eye-doze" d="M75 41 Q78 43.5 81 41" fill="none" stroke="#121110" stroke-width="1.6" stroke-linecap="round"/>
</svg>
